[build]
  command = "npm install"
  functions = "netlify/functions"
  publish = "src/dashboard"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "DATABASE_URL,OPENAI_API_KEY,R2_ACCESS_KEY,R2_BUCKET,R2_ENDPOINT,R2_PUBLIC_URL,R2_SECRET_KEY,TWILIO_SID,TWILIO_TOKEN,TWILIO_WHATSAPP_NUMBER"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/webhook/*"
  to = "/.netlify/functions/api/webhook/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
